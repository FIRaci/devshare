services:
  - type: web
    name: devshare-backend
    runtime: bun
    rootDir: reddit_backend
    buildCommand: bun install && bunx prisma generate
    startCommand: bun run src/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devshare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://devshare-backend.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: devshare-db
    plan: free
    databaseName: devshare
    ipAllowList: []
