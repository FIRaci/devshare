version: "1"

databases:
  - name: devshare-db
    databaseName: devshare
    user: devshare_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # 1. Backend Web Service (Bun + Elysia + Prisma)
  - type: web
    name: devshare-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: reddit_backend
    buildCommand: bun install && bunx prisma generate
    startCommand: bunx prisma db push && bun run src/seed.ts && bun run src/index.ts
    envVars:
      - key: BUN_VERSION
        value: latest
      - key: DATABASE_URL
        fromDatabase:
          name: devshare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://devshare-backend.onrender.com
      - key: NODE_ENV
        value: production

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: devshare-frontend
    runtime: static
    rootDir: reddit_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://devshare-backend.onrender.com
